spring:
  application:
    name: calculatewordservice
  datasource:
    url: jdbc:postgresql://localhost:5432/belajar_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # Redis untuk cache (@Cacheable) dan trending huruf (Sorted Set)
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

server:
  port: 8082
  servlet:
    context-path: /calculateword

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

kafka:
  bootstrap-servers: localhost:9092
  topic:
    word-analyzed: WORD_ANALYZED

minio:
  url: http://localhost:9000
  access:
    name: minioadmin
    secret: minioadmin
  bucket:
    name: batch19-report
  presigned-expiry-minutes: 10

quote:
  api:
    url: https://dummyjson.com

report:
  scheduler:
    # Spring cron 6 field: detik menit jam tanggal bulan hari
    # "0 0 0 * * *" = setiap hari jam 00:00. Untuk demo di kelas ganti ke "0 */1 * * * *" (tiap menit)
    cron: "0 0 0 * * *"
