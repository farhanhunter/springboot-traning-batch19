spring:
  application:
    name: userservice
  datasource:
    # jdbc:nama_db://host:port/nama_database
    url: jdbc:postgresql://localhost:5432/belajar_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
  servlet:
    context-path: /user

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  # HARUS sama dengan secret di gatewayservice.
  # Di production, isi lewat environment variable JWT_SECRET, jangan di-commit.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 jam dalam milliseconds (24 * 60 * 60 * 1000)

scheduler:
  test:
    # Spring cron 6 field: detik menit jam tanggal bulan hari
    cron: "*/30 * * * * *" # jalan tiap 30 detik. Isi "-" untuk mematikan
